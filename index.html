<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Oxford</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f4f7;
  color:#222;
}

.header{
  background:#1677ff;
  color:white;
  text-align:center;
  padding:22px 10px;
}

.header h1{
  margin:0;
  font-size:28px;
}

.header p{
  margin:8px 0 0;
}

.container{
  max-width:600px;
  margin:auto;
  padding:16px;
}

.welcome,
.card,
.contact{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:14px;
  text-align:center;
  box-shadow:0 2px 8px #0001;
}

.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.card{
  min-height:120px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:17px;
}

.icon{
  font-size:40px;
  margin-bottom:8px;
}

.phone{
  display:block;
  background:#1677ff;
  color:white;
  text-decoration:none;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="header">
  <h1>Computer Oxford</h1>
  <p>Computer • Laptop • Accessories • Service</p>
</div>

<div class="container">

  <div class="welcome">
    <h2>ស្វាគមន៍មកកាន់ Computer Oxford</h2>
    <p>ទំនិញកុំព្យូទ័រ Laptop និងគ្រឿងបន្លាស់</p>
  </div>

  <div class="menu">

    <div class="card" onclick="showMessage('Laptop')">
      <div class="icon">💻</div>
      Laptop
    </div>

    <div class="card" onclick="showMessage('Computer')">
      <div class="icon">🖥️</div>
      Computer
    </div>

    <div class="card" onclick="showMessage('Accessories')">
      <div class="icon">⌨️</div>
      Accessories
    </div>

    <div class="card" onclick="showMessage('Service')">
      <div class="icon">🔧</div>
      Service
    </div>

  </div>

  <div class="contact">
    <h2>📞 ទំនាក់ទំនង</h2>

    <a class="phone" href="tel:012517853">
      012 517 853
    </a>

    <a class="phone" href="tel:0978688585">
      097 868 8585
    </a>
  </div>

</div>

<script>
function showMessage(name){
  if(window.Telegram && Telegram.WebApp){
    Telegram.WebApp.showAlert("បានចុច " + name + " 👍");
  }else{
    alert("បានចុច " + name + " 👍");
  }
}

if(window.Telegram && Telegram.WebApp){
  Telegram.WebApp.ready();
}
</script>

</body>
</html>
