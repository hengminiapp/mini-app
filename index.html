<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Oxford</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f4f7;
  color:#222;
}

.header{
  background:#1677ff;
  color:white;
  text-align:center;
  padding:22px 10px;
}

.header h1{
  margin:0;
  font-size:28px;
}

.header p{
  margin:8px 0 0;
}

.container{
  max-width:600px;
  margin:auto;
  padding:16px;
}

.welcome{
  background:white;
  border-radius:15px;
  padding:20px;
  text-align:center;
  margin-bottom:18px;
}

.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.card{
  background:white;
  border-radius:15px;
  padding:25px 10px;
  text-align:center;
  font-size:18px;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card:active{
  transform:scale(.96);
}

.icon{
  font-size:40px;
  margin-bottom:10px;
}

.contact{
  background:white;
  margin-top:18px;
  padding:18px;
  border-radius:15px;
  text-align:center;
}

.phone{
  display:block;
  margin:10px;
  color:#1677ff;
  text-decoration:none;
  font-size:18px;
}
</style>
</head>

<body>

<div class="header">
  <h1>Computer Oxford</h1>
  <p>Computer • Laptop • Accessories • Service</p>
</div>

<div class="container">

<div class="welcome">
  <h2>ស្វាគមន៍មកកាន់<br>Computer Oxford</h2>
  <p>ទិញលក់ Laptop និងគ្រឿងបន្លាស់កុំព្យូទ័រ</p>
</div>

<div class="menu">

  <div class="card" onclick="showPage('Laptop')">
    <div class="icon">💻</div>
    Laptop
  </div>

  <div class="card" onclick="showPage('Computer')">
    <div class="icon">🖥️</div>
    Computer
  </div>

  <div class="card" onclick="showPage('Accessories')">
    <div class="icon">⌨️</div>
    Accessories
  </div>

  <div class="card" onclick="showPage('Service')">
    <div class="icon">🔧</div>
    Service
  </div>

</div>

<div class="contact">
  <h3>📞 ទំនាក់ទំនង</h3>

  <a class="phone" href="tel:012517853">
    012 517 853
  </a>

  <a class="phone" href="tel:0978688585">
    097 868 8585
  </a>
</div>

</div>

<script>
function showPage(name){
  document.body.innerHTML = `
    <div style="padding:20px;text-align:center;font-family:Arial,sans-serif;">
      <h1>🛒 ${name}</h1>
      <h2>Computer Oxford</h2>
      <p>សូមមើលទំនិញ និងព័ត៌មាន ${name}</p>
      <p>📞 012 517 853</p>
      <p>📞 097 868 8585</p>
      <button onclick="location.reload()" style="padding:12px 25px;border:0;border-radius:10px;background:#1677ff;color:white;font-size:16px;">
        ⬅️ ត្រឡប់ក្រោយ
      </button>
    </div>
  `;
}
</script>

</body>
</html>
