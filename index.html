<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Mini App</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 20px;
      margin: 0;
      background: #f2f4f7;
      color: #222;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    button {
      padding: 14px 25px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>My Mini App</h1>
    <p>Welcome to my Telegram Mini App</p>

    <button onclick="showMessage()">ចុចទីនេះ</button>

    <p id="message"></p>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function showMessage() {
      document.getElementById("message").textContent =
        "បានចុចរួចហើយ 👍";
    }
  </script>

</body>
</html>
